# Quality gate cho agent Part 7 (Exercise 7.3).
# run_eval.py trả exit code 1 khi accuracy < --min-accuracy hoặc có câu bị regression so với
# baseline → step fail → job fail → PR không merge được (bật "Require status checks to pass"
# cho job `eval` trong Branch protection của nhánh main).
name: quality-gate

on:
  pull_request:
    paths:
      - "06-lab-complete/benchmark-observability/**"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 06-lab-complete/benchmark-observability/develop/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start agent v2
        env:
          AGENT_VERSION: v2
          PORT: "8000"
          MOCK_ERROR_RATE: "0"   # eval đo chất lượng câu trả lời, không đo lỗi upstream ngẫu nhiên
        run: |
          nohup python app.py > agent.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "agent không lên được"; cat agent.log; exit 1

      - name: Run eval (fail nếu accuracy < 85% hoặc có regression)
        run: |
          python eval/run_eval.py --url http://localhost:8000 --min-accuracy 0.85 \
            --baseline reports/eval_v2_fixed.json --out eval_ci.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            06-lab-complete/benchmark-observability/develop/eval_ci.json
            06-lab-complete/benchmark-observability/develop/agent.log
