# Railway — deploy thư mục 06-lab-complete bằng Dockerfile
#   cd 06-lab-complete && railway up
# Biến môi trường đặt trên Railway (không ghi ở đây):
#   AGENT_API_KEY, REDIS_URL (=${{Redis.REDIS_URL}}), ENVIRONMENT=production,
#   RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD, MONTHLY_BUDGET_USD
# PORT do Railway cấp; CMD trong Dockerfile đã dùng ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
