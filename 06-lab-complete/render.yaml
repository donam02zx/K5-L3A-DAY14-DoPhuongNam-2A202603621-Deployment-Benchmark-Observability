# Render Blueprint — agent (Docker) + Redis-compatible Key Value (cả hai đều gói free)
# Dashboard Render → New → Blueprint → chọn repo → Blueprint Path: 06-lab-complete/render.yaml
# Đường dẫn dưới đây tính từ gốc repo; rootDir giới hạn build/auto-deploy vào thư mục này.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh secret, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    region: singapore
    ipAllowList: []                  # chỉ cho phép kết nối nội bộ từ service trên Render
    maxmemoryPolicy: noeviction
